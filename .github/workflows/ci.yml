name: LikeSized CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Canonical integrity / drift guard
        env:
          CANONICAL_HEAD_REF: ${{ github.head_ref }}
        run: npm run canonical:check
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Application safeguard suite
        run: |
          set +e
          failures=0
          for test_file in tests/*.test.ts; do
            label="${test_file#tests/}"
            echo "::group::$label"
            node --test "$test_file"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$label failed"
              failures=1
            fi
          done
          exit "$failures"
      - name: Build
        run: npm run build
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Initialize disposable local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Replay all canonical migrations on a fresh local database
        run: supabase db start
      - name: Run canonical database behavior tests
        run: supabase test db --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
