name: LikeSized CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Canonical integrity / drift guard
        run: npm run canonical:check

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Recommendation confidence calibration
        run: node --test tests/recommendation-confidence.test.ts

      - name: Fit Match audit UI semantics
        if: ${{ hashFiles('tests/fit-match-audit-ui.test.ts') != '' }}
        run: node --test tests/fit-match-audit-ui.test.ts

      - name: Outfit photo pipeline safeguards
        run: node --test tests/outfit-photo-pipeline.test.ts

      - name: Public homepage content safeguards
        run: node --test tests/public-homepage-content.test.ts

      - name: Build
        run: npm run build

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Initialize disposable local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Replay all canonical migrations on a fresh local database
        run: supabase db start

      - name: Run canonical database behavior tests
        run: supabase test db --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
