name: LikeSized CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Canonical integrity / drift guard
        env:
          CANONICAL_HEAD_REF: ${{ github.head_ref }}
        run: npm run canonical:check
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Application safeguard suite
        run: |
          set +e
          failures=0
          run_test() {
            label="$1"
            shift
            echo "::group::$label"
            "$@"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$label failed"
              failures=1
            fi
          }

          run_test "Recommendation confidence calibration" node --test tests/recommendation-confidence.test.ts
          if [ -f tests/fit-match-audit-ui.test.ts ]; then
            run_test "Fit Match audit UI semantics" node --test tests/fit-match-audit-ui.test.ts
          fi
          run_test "Outfit photo pipeline safeguards" node --test tests/outfit-photo-pipeline.test.ts
          run_test "New Outfit V1 safeguards" node --test tests/new-outfit-v1.test.ts
          run_test "Outfit polish batch safeguards" node --test tests/outfit-polish-batch.test.ts
          run_test "Outfit interaction and Fit Report photo safeguards" node --test tests/outfit-interaction-photo-requirement.test.ts
          run_test "Tagged-item quick-view safeguards" node --test tests/outfit-tagged-quickview-regression.test.ts
          run_test "Tracked Outfit variation evidence safeguards" node --test tests/outfit-variation-evidence.test.ts
          run_test "Outfit live-audit repair safeguards" node --test tests/outfit-live-audit-repairs.test.ts
          run_test "Current Outfit owner-audit closure safeguards" node --test tests/outfit-owner-audit-contract.test.ts
          run_test "Comment sheet and global quick-view safeguards" node --test tests/comments-global-quickview.test.ts
          run_test "Public homepage content safeguards" node --test tests/public-homepage-content.test.ts
          run_test "Grouped navigation safeguards" node --test tests/navigation-layout.test.ts
          run_test "Settings profile consolidation safeguards" node --test tests/settings-profile-consolidation.test.ts
          run_test "Canonical UI system safeguards" node --test tests/canonical-ui-system.test.ts
          run_test "Explore, My Circle, and LikeLocker safeguards" node --test tests/explore-circle-likelocker.test.ts
          run_test "Controlled Fit Report and community catalog safeguards" node --test tests/fit-report-taxonomy.test.ts
          run_test "Tracked variation-definition safeguards" node --test tests/variation-definition-map.test.ts
          run_test "Fit Report UI regression safeguards" node --test tests/fit-report-ui-regressions.test.ts
          run_test "Sleepwear and purchase-context safeguards" node --test tests/sleepwear-purchase-context.test.ts
          run_test "Moderation and garment-confirmation safeguards" node --test tests/moderation-foundation.test.ts

          exit "$failures"
      - name: Build
        run: npm run build
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Initialize disposable local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Replay all canonical migrations on a fresh local database
        run: supabase db start
      - name: Run canonical database behavior tests
        run: supabase test db --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
